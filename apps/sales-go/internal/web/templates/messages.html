{{define "messages.html"}}
{{template "head" .}}
{{template "shell-open" .}}
<section class="card narrow">
  <h3>Compose mail</h3>
  <p class="muted">Queued in EventLog for now. Production Resend delivery still runs on the Node API.</p>
  <form method="post" action="/messages" class="stack">
    <label>To<input type="email" name="to" required /></label>
    <label>Subject<input name="subject" required maxlength="200" /></label>
    <label>Body<textarea name="body" rows="8" required></textarea></label>
    <button type="submit">Queue message</button>
  </form>
</section>
{{template "shell-close" .}}
{{end}}
